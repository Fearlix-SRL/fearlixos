# image will be published to ghcr.io/<user>/<name>
name: fearlixos
# description will be included in the image's metadata
description: Fedora Silverblue by Fearlix SRL

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/ublue-os/silverblue-main
image-version: 45 # latest is also supported if you want new updates ASAP

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: dnf
    repos:
      copr:
        - atim/starship
    install:
      packages:
        - distrobox
        - gum
        - starship
        - btrfs-assistant
        - neovim
        - alacritty
        - vorta
        # gnome extensions
        - gnome-shell-extension-pop-shell
        - xprop
        - gnome-shell-extension-gsconnect
        - nautilus-gsconnect
        - webextension-gsconnect
        # virtualization
        - virt-install
        - libvirt-daemon-config-network
        - libvirt-daemon-kvm
        - qemu-kvm
        - virt-manager
        - virt-viewer
        - libguestfs-tools
        - python3-libguestfs
        - podman-compose

  - type: gnome-extensions
    install:
      - Blur my Shell
      - Caffeine
      - Color Picker
#     - Forge
      - User Themes
      - 307 # dash-to-dock

  - type: fonts
    fonts:
      nerd-fonts:
        - FiraMono

  - type: gschema-overrides
    include:
      - zz1-fearlix.gschema.override

  - type: default-flatpaks
    configurations:
      - scope: system
        notify: false
        install:
          # Core GNOME apps
          - org.gnome.Calculator
          - org.gnome.Calendar
          - org.gnome.Characters
          - org.gnome.Snapshot
          - org.gnome.clocks
          - org.gnome.Connections
          - org.gnome.Contacts
          - com.belmoussaoui.Decoder
          - org.gnome.baobab
          - org.gnome.SimpleScan
          - org.gnome.Papers
          - com.mattjakeman.ExtensionManager
          - org.gnome.font-viewer
          - org.gnome.Loupe
          - org.gnome.Logs
          - org.gnome.Maps
          - org.gnome.NautilusPreviewer
          - org.gnome.TextEditor
          - org.gnome.Showtime
          - org.gnome.Weather
          - org.gnome.Brasero
          - org.gnome.NetworkDisplays
          - org.kde.ark
          # System apps
          - org.fedoraproject.MediaWriter
          - com.github.tchx84.Flatseal
          - org.gustavoperedo.FontDownloader
          - ca.desrt.dconf-editor
          - io.missioncenter.MissionCenter

  # optional apps and extras: `ujust fearlix-setup`
  - type: justfiles
    validate: true
    include:
      - fearlix.just

  - type: systemd
    user:
      disabled:
        - livepaper.service

  - type: script
    scripts:
      - livepaper.sh
      - acer-wmi-battery.sh

  - type: signing # this sets up the proper policy & signing files for signed images to work fully
