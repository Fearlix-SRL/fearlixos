# Fearlix dev containers (https://github.com/Fearlix-SRL/dev-containers)
# Create missing ones:  ujust fearlix-containers [name... | all]
# Update to new images: ujust fearlix-containers-update [name...]
# See https://distrobox.it/usage/distrobox-assemble/

[base]
image=ghcr.io/fearlix-srl/base:latest
pull=true

[database]
image=ghcr.io/fearlix-srl/database:latest
pull=true
exported_apps=dbeaver

[flutter]
image=ghcr.io/fearlix-srl/flutter:latest
pull=true
exported_apps=code

[go]
image=ghcr.io/fearlix-srl/go:latest
pull=true
exported_apps=code

[node]
image=ghcr.io/fearlix-srl/node:latest
pull=true
exported_apps=code

[cloud]
image=ghcr.io/fearlix-srl/cloud:latest
pull=true
exported_apps=code

[dotnet]
image=ghcr.io/fearlix-srl/dotnet:latest
pull=true
exported_apps=code
