# Il modulo acer-wmi-battery dichiara l'alias con il GUID in parte minuscolo,
# ma il kernel espone il modalias in maiuscolo e modprobe confronta in modo
# case-sensitive: senza questo alias il modulo non si carica da solo.
# Scatta solo sui portatili Acer che espongono questo GUID WMI.
alias wmi:79772EC5-04B1-4BFD-843C-61E7F77B6CC9 acer-wmi-battery
